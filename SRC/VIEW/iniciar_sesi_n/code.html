<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-3xl font-bold text-center text-sky-800 mb-6">Iniciar sesión</h1>

    <form id="loginForm" class="space-y-5">
      <div>
        <label for="email" class="block mb-2 text-sm font-medium text-slate-700">Correo</label>
        <input id="email" name="email" type="email" required class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="tu.correo@ejemplo.com" />
      </div>

      <div>
        <label for="password" class="block mb-2 text-sm font-medium text-slate-700">Contraseña</label>
        <input id="password" name="password" type="password" required class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="********" />
      </div>

      <button type="submit" class="w-full bg-sky-700 text-white font-semibold py-3 rounded-xl hover:bg-sky-800 transition">
        Entrar
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      ¿No tienes cuenta?
      <a href="../crear_cuenta/code.html" class="text-sky-700 font-semibold underline">Crear cuenta</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Completa correo y contraseña.');
        return;
      }

      const formData = new FormData();
      formData.append('email', email);
      formData.append('password', password);

      try {
        const response = await fetch('../../../public/index.php?action=login', {
          method: 'POST',
          body: formData,
          credentials: 'same-origin'
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          const mensaje = result.errors ? result.errors.join('\n') : 'Credenciales incorrectas.';
          alert(mensaje);
          return;
        }

        localStorage.setItem('usuario', JSON.stringify(result.user || { email }));
        alert('Inicio de sesión correcto.');
        window.location.href = '../panel_de_usuario/code.html';
      } catch (error) {
        console.error(error);
        alert('No se pudo conectar con el backend. Verifica que PHP esté corriendo.');
      }
    });
  </script>
</body>
</html>
