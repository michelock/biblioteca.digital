<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego Matemático Infantil</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffcc00, #ff6699);
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      margin: 0;
      padding: 0;
      color: #fff;
    }
    h1 {
      font-size: 3em;
      text-shadow: 2px 2px #000;
      margin: 20px 0;
    }
    #hud {
      font-size: 1.5em;
      margin: 20px;
    }
    #pregunta {
      font-size: 2.5em;
      margin: 30px;
      animation: bounce 1s infinite alternate;
    }
    input {
      font-size: 1.5em;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      text-align: center;
    }
    #mensaje {
      font-size: 1.5em;
      margin-top: 20px;
      font-weight: bold;
      transition: transform 0.3s;
    }
    .barra-tiempo {
      width: 80%;
      height: 20px;
      background: #fff;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
    }
    .progreso {
      height: 100%;
      width: 100%;
      background: #4caf50;
      transition: width 1s linear;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <h1>🧮 Desafío Matemático</h1>
  <div id="hud">
    <span id="stat-score">Puntos: 0</span> |
    <span id="stat-time">Tiempo: 60s</span>
  </div>
  <div class="barra-tiempo">
    <div id="progreso" class="progreso"></div>
  </div>
  <div id="pregunta">Presiona cualquier tecla para comenzar</div>
  <input type="text" id="respuesta" placeholder="Escribe tu respuesta" autofocus>
  <div id="mensaje"></div>

  <script>
    let score = 0;
    let tiempo = 60;
    let resultado;
    let jugando = false;

    const pregunta = document.getElementById("pregunta");
    const respuesta = document.getElementById("respuesta");
    const mensaje = document.getElementById("mensaje");
    const statScore = document.getElementById("stat-score");
    const statTime = document.getElementById("stat-time");
    const progreso = document.getElementById("progreso");

    function nuevaPregunta() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      const operadores = ["+", "-", "*"];
      const operador = operadores[Math.floor(Math.random() * operadores.length)];
      if (operador === "+") resultado = num1 + num2;
      if (operador === "-") resultado = num1 - num2;
      if (operador === "*") resultado = num1 * num2;
      pregunta.textContent = `${num1} ${operador} ${num2} = ?`;
      respuesta.value = "";
    }

    function iniciarJuego() {
      jugando = true;
      score = 0;
      tiempo = 60;
      statScore.textContent = `Puntos: ${score}`;
      statTime.textContent = `Tiempo: ${tiempo}s`;
      progreso.style.width = "100%";
      nuevaPregunta();

      const temporizador = setInterval(() => {
        tiempo--;
        statTime.textContent = `Tiempo: ${tiempo}s`;
        progreso.style.width = `${(tiempo/60)*100}%`;
        if (tiempo <= 0) {
          clearInterval(temporizador);
          jugando = false;
          pregunta.textContent = "⏰ ¡Tiempo terminado!";
          mensaje.textContent = `Tu puntuación final: ${score}`;
          mensaje.style.color = "#fff";
        }
      }, 1000);
    }

    respuesta.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && jugando) {
        if (parseInt(respuesta.value) === resultado) {
          score++;
          mensaje.textContent = "✨ ¡Correcto!";
          mensaje.style.color = "lime";
          mensaje.style.transform = "scale(1.2)";
        } else {
          mensaje.textContent = "❌ Incorrecto.";
          mensaje.style.color = "red";
          mensaje.style.transform = "scale(1.2)";
        }
        statScore.textContent = `Puntos: ${score}`;
        nuevaPregunta();
        setTimeout(() => mensaje.style.transform = "scale(1)", 300);
      }
    });

    document.addEventListener("keydown", () => {
      if (!jugando) iniciarJuego();
    });
  </script>
</body>
</html>
